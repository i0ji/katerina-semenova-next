allowBuilds:
  '@parcel/watcher': true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - '@parcel/watcher'

minimumReleaseAgeExclude:
  - sass@1.101.7
  - tmp@0.2.4 || 0.2.6
  - postcss@8.5.10 || 8.5.12
  - sharp@0.35.0

onlyBuiltDependencies:
  - sharp

overrides:
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  sharp@<0.35.0: ^0.35.0
  tmp@<0.2.6: ^0.2.6
  tmp@<=0.2.3: ^0.2.4
